apiVersion: apps/v1
kind: Deployment
metadata:
  name: easycrud-frontend
  labels:
    app: easycrud-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: easycrud-frontend
  template:
    metadata:
      labels:
        app: easycrud-frontend
    spec:
      containers:
      - name: frontend
        image: easycrud-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: easycrud-frontend-service
spec:
  type: NodePort
  selector:
    app: easycrud-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
